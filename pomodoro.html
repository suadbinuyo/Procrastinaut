<!DOCTYPE html>

<head>
    <!--bootstrap styling-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <!--local stylesheet-->
    <link href="pomodoro.css" rel="stylesheet">
    <link href="main.css" rel="stylesheet">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="pomodoro-container">
        <div class="timer-wrapper">
            <img src="images/moon_med-removebg-preview.png" alt="holey_moon" class="timer-background">
            <div class="timer-overlay">
                <div id="timer" style="color: #021d15;">25:00</div>
            </div>

            <div class="btn-group" role="group">
                <button type="button" class="btn btn-info" onclick="startTimer()" data-mdb-ripple-init>Start</button>
                <button type="button" class="btn btn-info" onclick="pauseTimer()" data-mdb-ripple-init>Pause</button>
                <button type="button" class="btn btn-info" onclick="resetTimer()" data-mdb-ripple-init>Reset</button>
            </div>
        </div>
    </div>
    </div>




    <script>
        var timeLeft = 25 * 60;
        var timer;
        var running = false;

        function updateDisplay() {
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            document.getElementById('timer').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!running) {
                running = true;
                timer = setInterval(function () {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        alert("Time's up!");
                        running = false;
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timer);
            running = false;
        }

        function resetTimer() {
            clearInterval(timer);
            running = false;
            timeLeft = 25 * 60;
            updateDisplay();
        }

        updateDisplay();
    </script>

<script>
    // loads navbar from navbar.html + puts data in navbar-container
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        });
  </script>

</body>

</html>
