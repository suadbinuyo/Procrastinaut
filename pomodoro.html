    <div class="pomodoro-container">
        <div class="timer-wrapper">
            <img src="images/moon_med-removebg-preview.png" alt="holey_moon" class="timer-background">
            <div class="timer-overlay">
                <div id="timer" style="color: #021d15;">25:00</div>
            </div>

            <div class="btn-group" role="group">
                <button type="button" class="btn btn-info" onclick="startTimer()" data-mdb-ripple-init>Start</button>
                <button type="button" class="btn btn-info" onclick="pauseTimer()" data-mdb-ripple-init>Pause</button>
                <button type="button" class="btn btn-info" onclick="resetTimer()" data-mdb-ripple-init>Reset</button>
            </div>
        </div>
    </div>
    </div>




    <script>
        var timeLeft = 25 * 60;
        var timer;
        var running = false;

        function updateDisplay() {
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            document.getElementById('timer').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!running) {
                running = true;
                timer = setInterval(function () {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        alert("Time's up!");
                        running = false;
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timer);
            running = false;
        }

        function resetTimer() {
            clearInterval(timer);
            running = false;
            timeLeft = 25 * 60;
            updateDisplay();
        }

        updateDisplay();
    </script>
