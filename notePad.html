<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Pad</title>
    <link rel="stylesheet" href="notePad.css">
    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="https://unicons.iconscout.com/release-pro/v4.0.0/css/line.css">
</head>
<body>
  <div id="navbar-container"></div>

    <div class="popup-box">
        <div class="popup show">
            <div class="content">
                <header>
                    <p>Add a new note</p>
                    <i class="uil uil-times"></i>
                </header>
                <form id="notes-form" action="#">
                    <div class="row tile">
                        <label>Title</label>
                        <input type="text" id="noteInput">
                    </div>
                    <div class="row description">
                        <label for="">Description</label>
                       <textarea name="" id="noteDesc"></textarea>
                    </div>
                    <button class="add-note">Add Note</button>
                </form>
            </div>
        </div>
    </div>
<div class="wrapper">
   <li class="add-box">
    <div class="icon"><i class="uil uil-plus"></i></div>
    <p>Add new note</p>
   </li>

   <!-- <li class="note">
    <div class="details">
        <p>Title</p>
        <span>Add note</span> -->
    </div>


</div>
<!-- <script src="notePad.js"></script> -->
<script type="module" src="auth.js"></script>

<script>
  // loads navbar from navbar.html + puts data in navbar-container
  fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
          document.getElementById('navbar-container').innerHTML = data;
      });
</script>


</body>
</html>
