<html lang=en>

<head>
	<meta charset="UTF-8">

	<title>Backgrounds</title>
	<link rel="stylesheet" href="settings.css">

</head>
<body>
  <div id="navbar-container"></div>

	<div class="background-selector">

      <button data-bg="spaceMountain" class="bg-option">Mountains</button>
      <button data-bg="spaceship" class="bg-option">spaceship</button>
    <!--  <button data-bg="space" class="bg-option">Space</button>-->
    </div>
  </div>
</div>

	<img src = "images/moon.png" class="dark-icon">
	<img src = "images/sun.png"  class="light-icon"></button>-->

  <script>
    // loads navbar from navbar.html + puts data in navbar-container
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        });
  </script>

		
	<script  type="module" src="auth.js"></script>
